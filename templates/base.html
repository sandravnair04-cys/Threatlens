<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ThreatLens{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Threat<span>Lens</span></a>
    <nav>
        <a href="{{ url_for('index') }}">Scan</a>
        <a href="{{ url_for('history') }}">History</a>
    </nav>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="footer">
    ThreatLens is an educational tool. Results are indicators, not guarantees of safety.
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
